<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/gdg-leaderboard/favicon.ico" />

    <title>Cloud Study Leaderboard | GDG on Campus MCKV</title>
    <meta
      name="description"
      content="Live Google Cloud skill badge leaderboard for GDG on Campus MCKV. Track student and faculty progress, swag tiers and ranks, updated every 3 hours."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://eiono.github.io/gdg-leaderboard/" />
    <meta name="theme-color" content="#4285f4" />

    <!-- Google Search Console ownership check: after step 3 below, paste
         your code here and remove the comment markers
    <meta name="google-site-verification" content="PASTE_CODE_HERE" />
    -->

    <!-- Link previews (WhatsApp, LinkedIn, Facebook, Telegram) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cloud Study Leaderboard" />
    <meta property="og:title" content="Cloud Study Leaderboard | GDG on Campus MCKV" />
    <meta
      property="og:description"
      content="Live Google Cloud skill badge leaderboard. Track student and faculty progress, swag tiers and ranks."
    />
    <meta property="og:url" content="https://eiono.github.io/gdg-leaderboard/" />
    <meta property="og:image" content="https://eiono.github.io/gdg-leaderboard/logo.jpeg" />
    <meta property="og:image:alt" content="GDG on Campus MCKV Institute of Engineering logo" />
    <meta property="og:locale" content="en_IN" />

    <!-- Link previews on X / Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Cloud Study Leaderboard | GDG on Campus MCKV" />
    <meta
      name="twitter:description"
      content="Live Google Cloud skill badge leaderboard. Track student and faculty progress, swag tiers and ranks."
    />
    <meta name="twitter:image" content="https://eiono.github.io/gdg-leaderboard/logo.jpeg" />

    <!-- Tells search engines what this site is -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Cloud Study Leaderboard",
        "url": "https://eiono.github.io/gdg-leaderboard/",
        "description": "Live Google Cloud skill badge leaderboard for GDG on Campus MCKV Institute of Engineering.",
        "inLanguage": "en-IN",
        "publisher": {
          "@type": "Organization",
          "name": "GDG on Campus MCKV Institute of Engineering"
        }
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Shown to search engines and before the app loads; React replaces it -->
      <h1>Cloud Study Leaderboard</h1>
      <p>
        Live Google Cloud skill badge leaderboard for GDG on Campus MCKV
        Institute of Engineering. Track student and faculty progress, swag
        tiers and ranks. Loading the leaderboard...
      </p>
    </div>
    <noscript>
      Please turn on JavaScript to see the live leaderboard.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
