name: Refresh leaderboard

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write            # needed to commit the updated JSON

# Never let two refreshes run at the same time
concurrency:
  group: refresh-leaderboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          DEV_SHEET_CSV_URL: ${{ secrets.DEV_SHEET_CSV_URL }}
          STUDENT_SOLUTIONS_CSV_URL: ${{ secrets.STUDENT_SOLUTIONS_CSV_URL }}
          DEV_SOLUTIONS_CSV_URL: ${{ secrets.DEV_SOLUTIONS_CSV_URL }}
        run: python scraper/main.py

      - name: Commit updated data
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "leaderboard-bot@users.noreply.github.com"
          git add web/public/data/leaderboard.json web/public/data/developers.json logs/last_run.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Refresh leaderboard data"
          git pull --rebase
          git push